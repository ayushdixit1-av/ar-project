<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Logic MUX Network Lab | 4x1 & 8x1 Multiplexer Simulator</title>
  <meta name="description" content="Gamified Digital Logic Network Web Application for implementing and verifying truth tables of 4x1 and 8x1 Multiplexer ICs on a solderless breadboard and digital trainer kit.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Gamification & Controls Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">⚡ MUX LAB</div>
      <div>
        <h1 style="font-size: 15px; font-weight: 700; margin: 0;">Digital Logic Multiplexer Experiment</h1>
        <div class="brand-subtitle">IIT-K Virtual Lab • Module: Shreeni</div>
      </div>
    </div>

    <!-- Gamification Stats (Level & XP) -->
    <div class="gamify-bar">
      <div class="level-badge" id="level-badge">Lvl 1</div>
      <div class="xp-container">
        <div class="xp-bar-bg">
          <div class="xp-bar-fill" id="xp-progress"></div>
        </div>
        <div class="xp-text" id="xp-text">0 XP</div>
      </div>
    </div>

    <!-- Header Action Controls -->
    <div class="header-actions">
      <button class="btn-header active" id="btn-power">⚡ POWER: ON</button>
      <button class="btn-header" id="btn-audio">🔊 Sound: ON</button>
      <button class="btn-header" id="btn-datasheet">📖 IC Pinout Datasheet</button>
    </div>
  </header>

  <!-- Main Workbench Layout -->
  <main class="workbench-layout">

    <!-- Left Panel: Component Toolbox Drawer -->
    <aside class="toolbox-panel">
      <div>
        <div class="panel-title">🔌 IC Chips Drawer</div>
        <div class="ic-list">
          <button class="ic-btn" data-chip="74153">
            <span class="ic-chip-icon">74153</span>
            <div class="ic-info">
              <h4>Dual 4x1 MUX</h4>
              <p>16-Pin Dual Multiplexer</p>
            </div>
          </button>
          <button class="ic-btn" data-chip="74151">
            <span class="ic-chip-icon">74151</span>
            <div class="ic-info">
              <h4>8x1 MUX</h4>
              <p>16-Pin 8-to-1 Multiplexer</p>
            </div>
          </button>
          <button class="ic-btn" data-chip="7404">
            <span class="ic-chip-icon">7404</span>
            <div class="ic-info">
              <h4>Hex Inverter</h4>
              <p>6 x NOT Gates</p>
            </div>
          </button>
          <button class="ic-btn" data-chip="7408">
            <span class="ic-chip-icon">7408</span>
            <div class="ic-info">
              <h4>Quad AND</h4>
              <p>4 x 2-Input AND Gates</p>
            </div>
          </button>
          <button class="ic-btn" data-chip="7432">
            <span class="ic-chip-icon">7432</span>
            <div class="ic-info">
              <h4>Quad OR</h4>
              <p>4 x 2-Input OR Gates</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Wire Palette Selector -->
      <div>
        <div class="panel-title">🎨 Jumper Wire Color</div>
        <div class="color-palette">
          <div class="color-swatch active" data-color="#ef4444" style="background: #ef4444;" title="Red (VCC)"></div>
          <div class="color-swatch" data-color="#3b82f6" style="background: #3b82f6;" title="Blue (GND)"></div>
          <div class="color-swatch" data-color="#f59e0b" style="background: #f59e0b;" title="Yellow (Select S0-S2)"></div>
          <div class="color-swatch" data-color="#10b981" style="background: #10b981;" title="Green (Data Inputs)"></div>
          <div class="color-swatch" data-color="#a855f7" style="background: #a855f7;" title="Purple (Output Y)"></div>
          <div class="color-swatch" data-color="#ec4899" style="background: #ec4899;" title="Pink (Inverted Ȳ)"></div>
        </div>
      </div>

      <!-- Quick Helper Tools -->
      <div>
        <div class="panel-title">🛠️ Lab Tools</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button class="btn-header" id="btn-probe">🔍 Logic Probe</button>
          <button class="btn-header" id="btn-auto-wire" style="border-color: var(--accent-yellow); color: var(--accent-yellow);">⚡ Auto-Wire Preset</button>
          <button class="btn-header" id="btn-clear-wires">🗑️ Clear All Wires</button>
        </div>
      </div>
    </aside>

    <!-- Center Canvas: Trainer Kit & Solderless Breadboard -->
    <section class="workbench-center">
      <nav class="mode-tabs">
        <button class="mode-tab active" data-mode="4x1_MUX">🎓 Exp 1: 4x1 MUX Verification</button>
        <button class="mode-tab" data-mode="8x1_MUX">🔬 Exp 2: 8x1 MUX Verification</button>
        <button class="mode-tab" data-mode="CHALLENGE">🎯 Exp 3: Boolean Challenge</button>
        <button class="mode-tab" data-mode="SANDBOX">🛠️ Sandbox Mode</button>
      </nav>

      <div class="canvas-container" id="workbench-container">
        <canvas id="workbench-canvas"></canvas>
      </div>
    </section>

    <!-- Right Panel: Quest Instructions & Dynamic Truth Table -->
    <aside class="right-panel">
      <div class="quest-card">
        <div class="panel-title">📋 Experiment Guide</div>
        <div id="quest-guide-steps"></div>
      </div>

      <div class="truth-table-container">
        <div class="panel-title">📊 Truth Table Checklist</div>
        <div id="truth-table-body"></div>
      </div>
    </aside>

  </main>

  <!-- IC Datasheet Overlay Modal -->
  <div class="modal-overlay" id="modal-datasheet">
    <div class="modal-card">
      <button class="close-btn" id="close-datasheet">&times;</button>
      <div id="datasheet-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audioEngine.js"></script>
  <script src="js/simulationEngine.js"></script>
  <script src="js/breadboardEngine.js"></script>
  <script src="js/gamificationEngine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

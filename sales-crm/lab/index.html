<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Logic Lab — Walk In & Explore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;height:100vh;width:100vw;cursor:none;font-family:'Courier New',monospace;}
body.pointer-locked *{cursor:none!important;}
#start-screen,#eq-popup,#start-screen *,#eq-popup *{cursor:default!important;}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;position:fixed;inset:0;}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.5);}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%);}
#crosshair::after{width:100%;height:2px;top:50%;transform:translateY(-50%);}
#interact-hint{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);border:1px solid rgba(99,102,241,0.5);border-radius:8px;padding:8px 18px;color:#e2e8f0;font-size:13px;display:none;backdrop-filter:blur(4px);text-align:center;}
#interact-hint .key{display:inline-block;background:#6366f1;padding:2px 8px;border-radius:4px;font-weight:bold;margin:0 4px;font-size:12px;}
#minimap{position:fixed;bottom:16px;right:16px;border:2px solid rgba(99,102,241,0.4);border-radius:8px;background:rgba(0,0,0,0.7);z-index:20;overflow:hidden;}
#controls-hud{position:fixed;top:12px;left:12px;background:rgba(0,0,0,0.7);border:1px solid rgba(99,102,241,0.3);border-radius:8px;padding:10px 14px;color:#94a3b8;font-size:10px;line-height:1.8;z-index:20;backdrop-filter:blur(4px);}
#controls-hud b{color:#e2e8f0;}
#controls-hud kbd{background:#1e293b;padding:1px 5px;border-radius:3px;border:1px solid #334155;font-size:9px;}
#obj-label{position:absolute;top:50%;left:50%;transform:translate(-50%,30px);color:#e2e8f0;font-size:14px;font-weight:bold;text-shadow:0 0 10px rgba(99,102,241,0.8);display:none;text-align:center;pointer-events:none;}
#obj-desc{font-size:10px;color:#94a3b8;margin-top:4px;font-weight:normal;}
#start-screen{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;backdrop-filter:blur(10px);}
#start-screen h1{font-size:36px;background:linear-gradient(135deg,#818cf8,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900;}
#start-screen p{color:#64748b;font-size:13px;max-width:400px;text-align:center;line-height:1.6;}
#start-screen .start-btn{margin-top:10px;padding:14px 40px;background:#6366f1;border:none;color:#fff;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .2s;}
#start-screen .start-btn:hover{background:#4f46e5;transform:scale(1.05);}
#start-screen .keys-preview{display:flex;gap:6px;margin-top:10px;}
#start-screen .keys-preview kbd{background:#1e293b;padding:6px 12px;border-radius:6px;border:1px solid #334155;color:#94a3b8;font-size:12px;}
#eq-popup{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);pointer-events:auto;}
#eq-popup.show{display:flex;}
#eq-box{background:#111827;border:1px solid #1e293b;border-radius:14px;width:650px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.6);}
#eq-box-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#111827;z-index:1;}
#eq-box-header h2{font-size:16px;color:#818cf8;}
#eq-box-close{background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:4px;}
#eq-box-close:hover{background:#1e293b;color:#e2e8f0;}
#eq-box-body{padding:20px;}
.eq-section{margin-bottom:18px;}
.eq-section h3{font-size:12px;color:#818cf8;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #1e293b;}
.eq-section p{font-size:11px;color:#94a3b8;line-height:1.7;margin-bottom:6px;}
.eq-section p b{color:#e2e8f0;}
.eq-table{width:100%;border-collapse:collapse;font-size:11px;}
.eq-table tr{border-bottom:1px solid #1e293b;}
.eq-table td{padding:5px 8px;}
.eq-table td:first-child{color:#64748b;width:42%;}
.eq-table td:last-child{color:#e2e8f0;font-weight:600;}
#fps{position:fixed;top:12px;right:12px;color:#64748b;font-size:10px;z-index:20;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:4px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="crosshair"></div>
  <div id="interact-hint"><span class="key">E</span> Interact</div>
  <div id="obj-label"><span id="obj-name"></span><div id="obj-desc"></div></div>
  <div id="minimap"><canvas id="mm" width="140" height="140"></canvas></div>
  <div id="controls-hud">
    <b>Controls</b><br>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move<br>
    <kbd>Mouse</kbd> Look &nbsp; <kbd>E</kbd> Interact<br>
    <kbd>Esc</kbd> Release mouse
  </div>
</div>
<div id="fps">-- FPS</div>
<div id="start-screen">
  <h1>⚡ Digital Logic Lab</h1>
  <p>Walk into the lab. Explore every piece of equipment. Build circuits on the workbench.</p>
  <div class="keys-preview"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move <kbd>Mouse</kbd> Look <kbd>E</kbd> Interact</div>
  <button class="start-btn" onclick="startGame()">Enter Lab</button>
</div>
<div id="eq-popup">
  <div id="eq-box">
    <div id="eq-box-header"><h2 id="eq-title"></h2><button id="eq-box-close" onclick="closePopup()">✕</button></div>
    <div id="eq-box-body"></div>
  </div>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: false });
const SCALE = 3;
let W, H, RW, RH;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  RW = Math.ceil(W / SCALE); RH = Math.ceil(H / SCALE);
  canvas.width = RW; canvas.height = RH;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resize);
resize();

const PI = Math.PI, TAU = PI * 2;
const cosT = new Float32Array(3600), sinT = new Float32Array(3600);
for (let i = 0; i < 3600; i++) { const a = (i / 3600) * TAU; cosT[i] = Math.cos(a); sinT[i] = Math.sin(a); }
function fc(a) { return cosT[((a % TAU + TAU) % TAU) / TAU * 3600 | 0]; }
function fs(a) { return sinT[((a % TAU + TAU) % TAU) / TAU * 3600 | 0]; }

const MW = 24, MH = 24;
const map = new Uint8Array(MW * MH);
function gm(x, y) { return (x >= 0 && x < MW && y >= 0 && y < MH) ? map[y * MW + x] : 1; }
function sm(x, y, v) { if (x >= 0 && x < MW && y >= 0 && y < MH) map[y * MW + x] = v; }

for (let i = 0; i < MW; i++) { sm(i, 0, 1); sm(i, MH - 1, 1); }
for (let i = 0; i < MH; i++) { sm(0, i, 1); sm(MW - 1, i, 1); }
for (let x = 8; x <= 15; x++) for (let y = 10; y <= 12; y++) sm(x, y, 2);
for (let x = 1; x <= 2; x++) for (let y = 2; y <= 4; y++) sm(x, y, 3);
for (let x = 21; x <= 22; x++) for (let y = 2; y <= 4; y++) sm(x, y, 3);
for (let x = 9; x <= 14; x++) sm(x, 1, 5);

const P = { x: 12, y: 20, angle: -PI / 2, fov: PI / 3, bobPhase: 0, bobAmp: 0, target: null };
const MSPEED = 0.06, RSpeed = 0.003;
const keys = {};

const objects = [
  { x: 1.5, y: 3, type: "oscilloscope", name: "Oscilloscope", desc: "DSO - 100MHz, 2-Ch" },
  { x: 2.5, y: 3, type: "psu", name: "DC Power Supply", desc: "Triple Output 0-30V" },
  { x: 21.5, y: 3, type: "multimeter", name: "Multimeter", desc: "DMM - V, I, R" },
  { x: 22.5, y: 3, type: "solder", name: "Soldering Station", desc: "150-480 C" },
  { x: 9, y: 11, type: "breadboard", name: "Breadboard", desc: "830 tie-points" },
  { x: 12, y: 11, type: "components", name: "Component Bins", desc: "ICs, Resistors, LEDs" },
  { x: 15, y: 11, type: "fungen", name: "Signal Generator", desc: "0.1Hz - 10MHz" },
  { x: 1, y: 1, type: "clock", name: "Lab Clock", desc: "Wall Clock" },
  { x: 22, y: 1, type: "poster", name: "Logic Poster", desc: "Truth Tables" },
];

function tryMove(dx, dy) {
  const nx = P.x + dx, ny = P.y + dy, r = 0.2;
  const corners = [[nx-r,ny-r],[nx+r,ny-r],[nx-r,ny+r],[nx+r,ny+r],[nx,ny]];
  for (const c of corners) { if (gm(c[0]|0, c[1]|0) > 0) return; }
  P.x = nx; P.y = ny;
}

function update() {
  const cos = fc(P.angle), sin = fs(P.angle);
  let moving = false;
  if (keys["w"] || keys["arrowup"]) { tryMove(cos * MSPEED, sin * MSPEED); moving = true; }
  if (keys["s"] || keys["arrowdown"]) { tryMove(-cos * MSPEED, -sin * MSPEED); moving = true; }
  if (keys["a"] || keys["arrowleft"]) { tryMove(sin * MSPEED, -cos * MSPEED); moving = true; }
  if (keys["d"] || keys["arrowright"]) { tryMove(-sin * MSPEED, cos * MSPEED); moving = true; }
  if (keys["q"]) P.angle -= 0.04;

  if (moving) { P.bobPhase += 0.18; P.bobAmp = Math.min(P.bobAmp + 0.03, 1); }
  else P.bobAmp = Math.max(P.bobAmp - 0.06, 0);

  let best = null, bestD = Infinity;
  for (const o of objects) {
    const dx = o.x - P.x, dy = o.y - P.y, d2 = dx * dx + dy * dy;
    if (d2 > 36) continue;
    let a = Math.atan2(dy, dx) - P.angle;
    while (a > PI) a -= TAU; while (a < -PI) a += TAU;
    if (Math.abs(a) < 0.5 && d2 < bestD) { bestD = d2; best = o; }
  }
  P.target = best;

  const hint = document.getElementById("interact-hint");
  const label = document.getElementById("obj-label");
  if (best) {
    hint.style.display = "block"; label.style.display = "block";
    document.getElementById("obj-name").textContent = best.name;
    document.getElementById("obj-desc").textContent = best.desc;
  } else {
    hint.style.display = "none"; label.style.display = "none";
  }
}

const lights = [
  { x: 6, y: 6, r: 12, color: [255, 230, 180] },
  { x: 12, y: 6, r: 12, color: [255, 235, 190] },
  { x: 18, y: 6, r: 12, color: [255, 230, 180] },
  { x: 6, y: 15, r: 10, color: [255, 225, 170] },
  { x: 12, y: 15, r: 10, color: [255, 230, 180] },
  { x: 18, y: 15, r: 10, color: [255, 225, 170] },
];

function lightAt(wx, wy) {
  let lr = 40, lg = 35, lb = 30;
  for (const l of lights) {
    const dx = wx - l.x, dy = wy - l.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < l.r) {
      const f = 1 - d / l.r;
      const ff = f * f;
      lr += (l.color[0] - 40) * ff;
      lg += (l.color[1] - 35) * ff;
      lb += (l.color[2] - 30) * ff;
    }
  }
  return [Math.min(255, lr | 0), Math.min(255, lg | 0), Math.min(255, lb | 0)];
}

const WC = [null, [45, 42, 58], [95, 72, 50], [68, 50, 32], null, [210, 205, 195]];

let fpsCount = 0, fpsLast = performance.now(), fpsVal = 0;

function drawEquipSprite(o, sx, sy, sz, dist, isT) {
  const s = sz;
  const u = Math.max(1, (s / 12) | 0);
  const fogF = Math.min(1, dist / 8);

  function clr(r, g, b) {
    return `rgb(${(r * (1 - fogF * 0.5)) | 0},${(g * (1 - fogF * 0.5)) | 0},${(b * (1 - fogF * 0.5)) | 0})`;
  }

  const bx = sx - (s >> 1);
  const by = sy;

  switch (o.type) {
    case "oscilloscope": {
      const body = clr(50, 58, 52);
      const screen = clr(15, 30, 18);
      const grid = clr(30, 70, 35);
      const accent = clr(70, 160, 80);
      ctx.fillStyle = body;
      ctx.fillRect(bx, by, s, s * 0.8);
      ctx.fillStyle = clr(40, 46, 42);
      ctx.fillRect(bx, by + s * 0.8, s, s * 0.2);
      ctx.fillStyle = screen;
      ctx.fillRect(bx + s * 0.08, by + s * 0.08, s * 0.82, s * 0.55);
      ctx.strokeStyle = grid;
      ctx.lineWidth = Math.max(1, u * 0.3);
      for (let i = 1; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(bx + s * 0.08, by + s * 0.08 + (s * 0.55 * i / 5));
        ctx.lineTo(bx + s * 0.9, by + s * 0.08 + (s * 0.55 * i / 5)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx + s * 0.08 + (s * 0.82 * i / 5), by + s * 0.08);
        ctx.lineTo(bx + s * 0.08 + (s * 0.82 * i / 5), by + s * 0.08 + s * 0.55); ctx.stroke();
      }
      ctx.strokeStyle = accent; ctx.lineWidth = Math.max(1, u * 0.5);
      ctx.beginPath();
      ctx.moveTo(bx + s * 0.15, by + s * 0.35);
      for (let i = 0; i < 10; i++) {
        const px = bx + s * 0.15 + (s * 0.7 * i / 10);
        const py = by + s * 0.25 + Math.sin(i * 1.2) * s * 0.1;
        ctx.lineTo(px, py);
      }
      ctx.stroke();
      const knobY = by + s * 0.68;
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = clr(80, 80, 80);
        ctx.beginPath(); ctx.arc(bx + s * 0.15 + i * s * 0.22, knobY, u * 1.2, 0, TAU); ctx.fill();
        ctx.fillStyle = clr(100, 100, 100);
        ctx.beginPath(); ctx.arc(bx + s * 0.15 + i * s * 0.22, knobY, u * 0.6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = clr(60, 60, 60);
      ctx.fillRect(bx + s * 0.05, by + s * 0.84, s * 0.35, s * 0.12);
      ctx.fillRect(bx + s * 0.45, by + s * 0.84, s * 0.35, s * 0.12);
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("DSO 100MHz", sx, by - u * 1.5); }
      break;
    }
    case "psu": {
      const body = clr(60, 65, 75);
      const disp = clr(20, 40, 80);
      ctx.fillStyle = body; ctx.fillRect(bx, by, s, s * 0.85);
      ctx.fillStyle = clr(48, 52, 62); ctx.fillRect(bx, by + s * 0.85, s, s * 0.15);
      ctx.fillStyle = disp; ctx.fillRect(bx + s * 0.08, by + s * 0.08, s * 0.55, s * 0.4);
      ctx.fillStyle = clr(80, 160, 255); ctx.font = `bold ${Math.max(5, u * 3)}px Courier New`; ctx.textAlign = "left";
      ctx.fillText("5.00V", bx + s * 0.12, by + s * 0.28);
      ctx.fillStyle = clr(50, 200, 100); ctx.fillText("1.50A", bx + s * 0.12, by + s * 0.42);
      ctx.fillStyle = clr(220, 40, 40); ctx.beginPath(); ctx.arc(bx + s * 0.75, by + s * 0.25, u * 1.5, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(40, 40, 40); ctx.beginPath(); ctx.arc(bx + s * 0.75, by + s * 0.25, u * 0.7, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(200, 40, 40); ctx.beginPath(); ctx.arc(bx + s * 0.25, by + s * 0.92, u * 1, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(20, 20, 20); ctx.beginPath(); ctx.arc(bx + s * 0.4, by + s * 0.92, u * 1, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(200, 180, 40); ctx.beginPath(); ctx.arc(bx + s * 0.55, by + s * 0.92, u * 1, 0, TAU); ctx.fill();
      for (let i = 0; i < 2; i++) {
        ctx.fillStyle = clr(80, 80, 85);
        ctx.beginPath(); ctx.arc(bx + s * 0.72 + i * s * 0.13, by + s * 0.55, u * 1.2, 0, TAU); ctx.fill();
      }
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("DC PSU 30V", sx, by - u * 1.5); }
      break;
    }
    case "multimeter": {
      const body = clr(180, 150, 30);
      const face = clr(30, 30, 25);
      ctx.fillStyle = body; ctx.fillRect(bx, by, s, s * 0.9);
      ctx.fillStyle = clr(160, 130, 25); ctx.fillRect(bx + s * 0.05, by + s * 0.04, s * 0.9, s * 0.28);
      ctx.fillStyle = face; ctx.fillRect(bx + s * 0.1, by + s * 0.08, s * 0.8, s * 0.2);
      ctx.fillStyle = clr(120, 200, 120); ctx.font = `bold ${Math.max(5, u * 3)}px Courier New`; ctx.textAlign = "right";
      ctx.fillText("3.456", bx + s * 0.85, by + s * 0.22);
      ctx.fillStyle = clr(140, 140, 40); ctx.beginPath(); ctx.arc(bx + s * 0.5, by + s * 0.55, u * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(60, 60, 50); ctx.beginPath(); ctx.arc(bx + s * 0.5, by + s * 0.55, u * 1.5, 0, TAU); ctx.fill();
      const jackY = by + s * 0.82;
      ctx.fillStyle = clr(20, 20, 20); ctx.beginPath(); ctx.arc(bx + s * 0.25, jackY, u * 0.8, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(200, 40, 40); ctx.beginPath(); ctx.arc(bx + s * 0.45, jackY, u * 0.8, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(40, 40, 200); ctx.beginPath(); ctx.arc(bx + s * 0.65, jackY, u * 0.8, 0, TAU); ctx.fill();
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("DMM", sx, by - u * 1.5); }
      break;
    }
    case "solder": {
      const body = clr(70, 70, 78);
      ctx.fillStyle = body; ctx.fillRect(bx, by, s * 0.7, s * 0.8);
      ctx.fillStyle = clr(55, 55, 62); ctx.fillRect(bx, by + s * 0.8, s * 0.7, s * 0.2);
      ctx.fillStyle = clr(200, 50, 50); ctx.beginPath(); ctx.arc(bx + s * 0.15, by + s * 0.15, u, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(80, 80, 80); ctx.beginPath(); ctx.arc(bx + s * 0.35, by + s * 0.45, u * 2, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(100, 100, 100); ctx.beginPath(); ctx.arc(bx + s * 0.35, by + s * 0.45, u, 0, TAU); ctx.fill();
      ctx.strokeStyle = clr(160, 140, 100); ctx.lineWidth = Math.max(1, u * 0.5);
      ctx.beginPath(); ctx.moveTo(bx + s * 0.72, by + s * 0.1); ctx.lineTo(bx + s * 1.0, by + s * 0.6); ctx.stroke();
      ctx.fillStyle = clr(200, 200, 200);
      ctx.beginPath(); ctx.arc(bx + s * 1.0, by + s * 0.6, u * 0.6, 0, TAU); ctx.fill();
      ctx.fillStyle = clr(50, 120, 200);
      ctx.fillRect(bx + s * 0.08, by + s * 0.55, s * 0.5, s * 0.12);
      ctx.fillStyle = "#fff"; ctx.font = `${Math.max(4, u * 2)}px Courier New`; ctx.textAlign = "center";
      ctx.fillText("350C", bx + s * 0.35, by + s * 0.64);
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Solder", sx, by - u * 1.5); }
      break;
    }
    case "breadboard": {
      const body = clr(220, 215, 200);
      ctx.fillStyle = body; ctx.fillRect(bx, by, s, s * 0.5);
      ctx.fillStyle = clr(200, 195, 180); ctx.fillRect(bx, by + s * 0.5, s, s * 0.5);
      ctx.strokeStyle = clr(200, 60, 60); ctx.lineWidth = u * 0.5;
      ctx.beginPath(); ctx.moveTo(bx + s * 0.02, by + s * 0.08); ctx.lineTo(bx + s * 0.98, by + s * 0.08); ctx.stroke();
      ctx.strokeStyle = clr(40, 40, 200);
      ctx.beginPath(); ctx.moveTo(bx + s * 0.02, by + s * 0.42); ctx.lineTo(bx + s * 0.98, by + s * 0.42); ctx.stroke();
      ctx.strokeStyle = clr(180, 175, 160); ctx.lineWidth = u * 0.3;
      ctx.beginPath(); ctx.moveTo(bx, by + s * 0.48); ctx.lineTo(bx + s, by + s * 0.48); ctx.stroke();
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 10; col++) {
          ctx.fillStyle = clr(140, 135, 120);
          ctx.fillRect(bx + s * 0.08 + col * s * 0.08, by + s * 0.15 + row * s * 0.06, u * 0.4, u * 0.4);
          ctx.fillRect(bx + s * 0.08 + col * s * 0.08, by + s * 0.55 + row * s * 0.06, u * 0.4, u * 0.4);
        }
      }
      const wireColors = [clr(220,50,50), clr(50,50,220), clr(50,200,50)];
      ctx.lineWidth = u * 0.4;
      for (let i = 0; i < 3; i++) {
        ctx.strokeStyle = wireColors[i];
        ctx.beginPath();
        ctx.moveTo(bx + s * 0.2 + i * s * 0.15, by + s * 0.18);
        ctx.quadraticCurveTo(bx + s * 0.3 + i * s * 0.1, by - s * 0.05, bx + s * 0.5 + i * s * 0.08, by + s * 0.35);
        ctx.stroke();
      }
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Breadboard", sx, by - u * 1.5); }
      break;
    }
    case "components": {
      const shelf = clr(70, 55, 38);
      ctx.fillStyle = shelf; ctx.fillRect(bx, by, s, s);
      const binColors = [clr(50,80,160), clr(200,60,60), clr(60,160,60), clr(200,160,40), clr(160,60,160)];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const cx2 = bx + s * 0.1 + c * s * 0.28;
          const cy = by + s * 0.08 + r * s * 0.28;
          ctx.fillStyle = binColors[(r * 3 + c) % 5];
          ctx.fillRect(cx2, cy, s * 0.24, s * 0.22);
          ctx.fillStyle = clr(220, 220, 220);
          ctx.fillRect(cx2, cy, s * 0.24, u * 0.8);
        }
      }
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Components", sx, by - u * 1.5); }
      break;
    }
    case "fungen": {
      const body = clr(45, 50, 58);
      ctx.fillStyle = body; ctx.fillRect(bx, by, s, s * 0.82);
      ctx.fillStyle = clr(38, 42, 48); ctx.fillRect(bx, by + s * 0.82, s, s * 0.18);
      ctx.fillStyle = clr(15, 35, 15); ctx.fillRect(bx + s * 0.06, by + s * 0.06, s * 0.6, s * 0.35);
      ctx.strokeStyle = clr(60, 180, 60); ctx.lineWidth = Math.max(1, u * 0.4);
      ctx.beginPath();
      for (let i = 0; i < 20; i++) {
        const px = bx + s * 0.08 + i * s * 0.027;
        const py = by + s * 0.23 + Math.sin(i * 0.8) * s * 0.1;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.fillStyle = clr(60, 200, 60); ctx.font = `${Math.max(4, u * 2)}px Courier New`; ctx.textAlign = "left";
      ctx.fillText("1kHz", bx + s * 0.1, by + s * 0.45);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = clr(80, 80, 85);
        ctx.beginPath(); ctx.arc(bx + s * 0.72, by + s * 0.15 + i * s * 0.2, u * 1.2, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = clr(180, 40, 40); ctx.beginPath(); ctx.arc(bx + s * 0.15, by + s * 0.9, u, 0, TAU); ctx.fill();
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Sig Gen", sx, by - u * 1.5); }
      break;
    }
    case "clock": {
      const r2 = s * 0.45;
      ctx.fillStyle = clr(220, 215, 200);
      ctx.beginPath(); ctx.arc(sx, sy + s * 0.15, r2, 0, TAU); ctx.fill();
      ctx.strokeStyle = clr(40, 40, 40); ctx.lineWidth = u * 0.5;
      ctx.beginPath(); ctx.arc(sx, sy + s * 0.15, r2, 0, TAU); ctx.stroke();
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU - PI / 2;
        const inner = r2 * 0.82, outer = r2 * 0.95;
        ctx.strokeStyle = clr(40, 40, 40); ctx.lineWidth = i % 3 === 0 ? u * 0.6 : u * 0.3;
        ctx.beginPath();
        ctx.moveTo(sx + fc(a) * inner, sy + s * 0.15 + fs(a) * inner);
        ctx.lineTo(sx + fc(a) * outer, sy + s * 0.15 + fs(a) * outer);
        ctx.stroke();
      }
      ctx.strokeStyle = clr(20, 20, 20); ctx.lineWidth = u * 0.6;
      ctx.beginPath(); ctx.moveTo(sx, sy + s * 0.15);
      ctx.lineTo(sx + fc(-PI * 0.3) * r2 * 0.5, sy + s * 0.15 + fs(-PI * 0.3) * r2 * 0.5); ctx.stroke();
      ctx.lineWidth = u * 0.4;
      ctx.beginPath(); ctx.moveTo(sx, sy + s * 0.15);
      ctx.lineTo(sx + fc(PI * 0.15) * r2 * 0.7, sy + s * 0.15 + fs(PI * 0.15) * r2 * 0.7); ctx.stroke();
      ctx.fillStyle = clr(180, 40, 40);
      ctx.beginPath(); ctx.arc(sx, sy + s * 0.15, u, 0, TAU); ctx.fill();
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Clock", sx, sy - r2 - u * 2); }
      break;
    }
    case "poster": {
      ctx.fillStyle = clr(230, 225, 215); ctx.fillRect(bx, by, s, s * 1.1);
      ctx.strokeStyle = clr(100, 80, 60); ctx.lineWidth = u * 0.4; ctx.strokeRect(bx, by, s, s * 1.1);
      ctx.fillStyle = clr(40, 40, 100); ctx.font = `bold ${Math.max(4, u * 2.5)}px Courier New`; ctx.textAlign = "center";
      ctx.fillText("LOGIC GATES", sx, by + s * 0.12);
      ctx.strokeStyle = clr(100, 100, 100); ctx.lineWidth = u * 0.2;
      const tableData = ["AND  OR   XOR", "NAND NOR  NOT", "A*B  A+B  A^B"];
      for (let i = 0; i < tableData.length; i++) {
        ctx.fillStyle = clr(60, 60, 60); ctx.font = `${Math.max(3, u * 1.8)}px Courier New`;
        ctx.fillText(tableData[i], sx, by + s * 0.28 + i * s * 0.18);
      }
      ctx.strokeStyle = clr(80, 80, 80); ctx.lineWidth = u * 0.2;
      ctx.strokeRect(bx + s * 0.08, by + s * 0.18, s * 0.84, s * 0.65);
      if (isT) { ctx.fillStyle = "#818cf8"; ctx.font = `bold ${Math.max(6, u * 3)}px Courier New`; ctx.textAlign = "center"; ctx.fillText("Logic Poster", sx, by - u * 2); }
      break;
    }
  }
}

function frame() {
  update();

  const halfH = RH >> 1;
  const bob = (P.bobAmp * Math.sin(P.bobPhase) * 2) | 0;
  const halfFov = P.fov / 2;

  for (let col = 0; col < RW; col++) {
    const rayA = P.angle - halfFov + (col / RW) * P.fov;
    const dirX = fc(rayA), dirY = fs(rayA);

    let mapX = P.x | 0, mapY = P.y | 0;
    const ddx = dirX === 0 ? 1e10 : Math.abs(1 / dirX);
    const ddy = dirY === 0 ? 1e10 : Math.abs(1 / dirY);
    let stepX, stepY, sdx, sdy;

    if (dirX < 0) { stepX = -1; sdx = (P.x - mapX) * ddx; }
    else { stepX = 1; sdx = (mapX + 1 - P.x) * ddx; }
    if (dirY < 0) { stepY = -1; sdy = (P.y - mapY) * ddy; }
    else { stepY = 1; sdy = (mapY + 1 - P.y) * ddy; }

    let side = 0, hit = 0;
    for (let i = 0; i < 30; i++) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else { sdy += ddy; mapY += stepY; side = 1; }
      hit = gm(mapX, mapY);
      if (hit > 0) break;
    }

    let pd;
    if (side === 0) pd = (mapX - P.x + (1 - stepX) / 2) / dirX;
    else pd = (mapY - P.y + (1 - stepY) / 2) / dirY;
    if (pd < 0.01) pd = 0.01;

    const lineH = (RH / pd) | 0;
    const ds = Math.max(0, halfH - (lineH >> 1) + bob);
    const de = Math.min(RH - 1, halfH + (lineH >> 1) + bob);

    const lightDist = pd * 0.35;
    const shade = Math.max(20, 255 * Math.exp(-lightDist * 0.12)) | 0;
    const sm2 = side ? 0.72 : 1.0;
    const wc = WC[hit] || [40, 40, 50];

    const lc = lightAt(mapX + 0.5, mapY + 0.5);
    const lightMul = shade / 255;
    const wr = Math.min(255, (wc[0] * sm2 * 0.4 + lc[0] * lightMul * 0.6) | 0);
    const wg = Math.min(255, (wc[1] * sm2 * 0.4 + lc[1] * lightMul * 0.6) | 0);
    const wb = Math.min(255, (wc[2] * sm2 * 0.4 + lc[2] * lightMul * 0.6) | 0);

    const cLight = lightAt(mapX + 0.5, mapY + 0.5);
    const cFog = shade / 255;
    const cr = (cLight[0] * cFog * 0.18) | 0;
    const cg = (cLight[1] * cFog * 0.20) | 0;
    const cb = (cLight[2] * cFog * 0.22) | 0;
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
    if (ds > 0) ctx.fillRect(col, 0, 1, ds);

    ctx.fillStyle = `rgb(${wr},${wg},${wb})`;
    if (de >= ds) ctx.fillRect(col, ds, 1, de - ds + 1);

    const fLight = lightAt(mapX + 0.5, mapY + 0.5);
    const fFog = shade / 255;
    ctx.fillStyle = `rgb(${(fLight[0] * fFog * 0.14) | 0},${(fLight[1] * fFog * 0.12) | 0},${(fLight[2] * fFog * 0.10) | 0})`;
    if (de < RH - 1) ctx.fillRect(col, de + 1, 1, RH - de - 1);
  }

  for (const o of objects) {
    const dx = o.x - P.x, dy = o.y - P.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > 121) continue;
    let a = Math.atan2(dy, dx) - P.angle;
    while (a > PI) a -= TAU; while (a < -PI) a += TAU;
    if (Math.abs(a) > P.fov * 0.6) continue;
    const dist = Math.sqrt(d2);
    const sx = ((a / P.fov + 0.5) * RW) | 0;
    const sz = Math.max(4, (RH / dist * 0.22) | 0);
    const sy = (halfH - (sz * 0.55) + bob) | 0;
    drawEquipSprite(o, sx, sy, sz, dist, P.target === o);
  }

  drawLightGlows(bob);

  drawMinimap();

  fpsCount++;
  const now = performance.now();
  if (now - fpsLast > 1000) { fpsVal = fpsCount; fpsCount = 0; fpsLast = now; document.getElementById("fps").textContent = fpsVal + " FPS"; }

  requestAnimationFrame(frame);
}

function drawLightGlows(bob) {
  for (const l of lights) {
    const dx = l.x - P.x, dy = l.y - P.y;
    if (dx * dx + dy * dy > 256) continue;
    let a = Math.atan2(dy, dx) - P.angle;
    while (a > PI) a -= TAU; while (a < -PI) a += TAU;
    if (Math.abs(a) > P.fov * 1.2) continue;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.5) continue;
    const sx = ((a / P.fov + 0.5) * RW) | 0;
    const screenY = (RH * 0.15 + bob) | 0;
    const radius = Math.max(5, (30 / dist) | 0);
    const alpha = Math.max(0.02, 0.15 / dist);
    const grad = ctx.createRadialGradient(sx, screenY, 0, sx, screenY, radius);
    grad.addColorStop(0, `rgba(255,240,200,${alpha})`);
    grad.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(sx - radius, screenY - radius, radius * 2, radius * 2);
  }
}

const mmC = document.getElementById("mm");
const mmX = mmC.getContext("2d");
let mmF = 0;
function drawMinimap() {
  if (++mmF % 8 !== 0) return;
  mmX.clearRect(0, 0, 140, 140);
  const s = 140 / MW;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const t = gm(x, y); if (!t) continue;
    mmX.fillStyle = t===1?"#2a3a5a":t===2?"#5a4030":t===3?"#3a2a1a":t===5?"#aaa":"#333";
    mmX.fillRect(x*s, y*s, s+.5, s+.5);
  }
  for (const o of objects) { mmX.fillStyle = P.target===o?"#6366f1":"#555"; mmX.fillRect(o.x*s-1.5, o.y*s-1.5, 3, 3); }
  mmX.fillStyle="#22c55e"; mmX.beginPath(); mmX.arc(P.x*s,P.y*s,3,0,TAU); mmX.fill();
  mmX.strokeStyle="#22c55e"; mmX.lineWidth=1.5; mmX.beginPath(); mmX.moveTo(P.x*s,P.y*s);
  mmX.lineTo((P.x+fc(P.angle)*1.5)*s,(P.y+fs(P.angle)*1.5)*s); mmX.stroke();
}

    <p><b>De Morgan:</b> (AB)' = A'+B' and (A+B)' = A'*B'<br>
    <b>A+0=A</b> and <b>A*1=A</b> and <b>A+A'=1</b> and <b>A*A'=0</b></p></div>
    <div class="eq-section"><h3>IC Reference</h3><p>Pin 14 = VCC (+5V). Pin 7 = GND. Numbering: CCW from dot.</p></div>` },
};

function openEquipment(type) {
  const eq = EQ[type]; if (!eq) return;
  document.getElementById("eq-title").textContent = eq.t;
  document.getElementById("eq-box-body").innerHTML = eq.h;
  document.getElementById("eq-popup").classList.add("show");
}
function closePopup() { document.getElementById("eq-popup").classList.remove("show"); }

function startGame() {
  document.getElementById("start-screen").style.display = "none";
  canvas.requestPointerLock();
  requestAnimationFrame(frame);
}
document.addEventListener("click", () => {
  if (document.getElementById("start-screen").style.display !== "none") return;
  if (!mouseLocked && !document.getElementById("eq-popup").classList.contains("show"))
    canvas.requestPointerLock();
});
</script>
</body>

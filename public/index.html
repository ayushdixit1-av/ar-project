<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Pilot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <nav class="navbar">
      <div class="logo">AI Interview Pilot</div>
      <div class="nav-links">
        <button class="nav-btn active" onclick="showScreen('home')">Home</button>
        <button class="nav-btn" onclick="showScreen('dashboard')">Dashboard</button>
      </div>
    </nav>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
      <div class="hero">
        <h1>AI-Powered Interview</h1>
        <p>Practice interviews with an intelligent AI interviewer</p>
      </div>

      <div class="card setup-card">
        <h2>Start New Interview</h2>
        <form id="start-form" onsubmit="startInterview(event)">
          <div class="form-group">
            <label for="candidate-name">Full Name</label>
            <input type="text" id="candidate-name" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label for="candidate-email">Email</label>
            <input type="email" id="candidate-email" placeholder="john@example.com" required />
          </div>
          <div class="form-group">
            <label for="job-role">Job Position</label>
            <select id="job-role" required>
              <option value="">Select a position...</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Begin Interview</button>
        </form>
      </div>
    </div>

    <!-- INTERVIEW SCREEN -->
    <div id="screen-interview" class="screen">
      <div class="interview-header">
        <div class="interview-info">
          <h2 id="interview-role"></h2>
          <span id="interview-candidate"></span>
        </div>
        <button class="btn btn-danger" onclick="endInterview()">End Interview</button>
      </div>
      <div id="chat-container" class="chat-container">
        <div id="chat-messages" class="chat-messages"></div>
      </div>
      <div class="chat-input-area">
        <textarea id="user-input" placeholder="Type your answer..." rows="2" onkeydown="handleKeydown(event)"></textarea>
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <!-- EVALUATION SCREEN -->
    <div id="screen-evaluation" class="screen">
      <div class="card evaluation-card">
        <h2>Interview Evaluation</h2>
        <div id="evaluation-content" class="evaluation-content"></div>
        <div class="eval-actions">
          <button class="btn btn-primary" onclick="showScreen('home')">New Interview</button>
          <button class="btn btn-secondary" onclick="showScreen('dashboard')">View Dashboard</button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="screen-dashboard" class="screen">
      <div class="dashboard-header">
        <h2>Interview Dashboard</h2>
        <button class="btn btn-primary" onclick="showScreen('home')">+ New Interview</button>
      </div>
      <div id="interview-list" class="interview-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
